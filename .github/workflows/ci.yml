name: Logistics Optimization Engine CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: logistics_engine

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r logistics_engine/requirements.txt

      - name: Run test suite
        run: python -m unittest discover -s logistics_engine/tests -v

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          path: logistics_engine

      - name: Build Docker image
        working-directory: logistics_engine
        run: docker build -t logistics-engine-ci .
